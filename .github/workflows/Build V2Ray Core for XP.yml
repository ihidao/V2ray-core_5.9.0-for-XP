
name: Build V2Ray Core 5.9.0 for Windows XP

on:
  workflow_dispatch:
  push:
    branches:
      - xp-v2ray-core-v5.9.0
    paths:
      - 'v2ray-core/**'
      - '.github/workflows/Build V2Ray Core for XP.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install bootstrap Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21.13'
          cache: false

      - name: Build Windows XP compatible Go toolchain
        shell: bash
        run: |
          git clone --depth 1 \
            --branch release-branch.go1.21-nt51 \
            https://github.com/BieHDC/go-backports.git

          cd go-backports/src

          export GOROOT_BOOTSTRAP="$(go env GOROOT)"

          ./make.bash

          echo "GOROOT=$GITHUB_WORKSPACE/go-backports" >> $GITHUB_ENV
          echo "$GITHUB_WORKSPACE/go-backports/bin" >> $GITHUB_PATH

      - name: Check XP Go toolchain
        shell: bash
        run: |
          go version
          go env GOROOT

      - name: Check V2Ray dependencies
        working-directory: v2ray-core
        shell: bash
        env:
          GOTOOLCHAIN: local
        run: |
          echo "===== Go version ====="
          go version

          echo "===== Download dependencies ====="
          go mod download

          echo "===== QUIC dependency ====="
          go list -m github.com/quic-go/quic-go

          echo "===== qtls dependency ====="
          go list -m github.com/quic-go/qtls-go1-20

          echo "===== Check old qtls ====="
          if go list -m all | grep -E 'marten-seemann/qtls-go1-15'; then
            echo "ERROR: Old qtls dependency detected"
            exit 1
          fi

      - name: Build V2Ray for Windows XP x86
        working-directory: v2ray-core
        shell: bash
        env:
          GOOS: windows
          GOARCH: '386'
          CGO_ENABLED: '0'
          GOTOOLCHAIN: local
        run: |
          go build -v \
            -trimpath \
            -ldflags "-s -w -buildid=" \
            -o v2ray.exe \
            ./main

          go build -v \
            -trimpath \
            -ldflags "-s -w -buildid=" \
            -tags confonly \
            -o v2ctl.exe \
            ./infra/control/main

      - name: Verify binaries
        shell: bash
        run: |
          mkdir -p release-xp

          cp v2ray-core/v2ray.exe release-xp/
          cp v2ray-core/v2ctl.exe release-xp/

          file release-xp/v2ray.exe
          file release-xp/v2ctl.exe

          ls -lh release-xp/

      - name: Upload XP binaries
        uses: actions/upload-artifact@v4
        with:
          name: V2Ray-Core-5.9.0-Windows-XP-x86
          path: release-xp/
          if-no-files-found: error
          retention-days: 30
